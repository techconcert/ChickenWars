<body>
<div id="ui">
  <h1>Hex island (procedural)</h1>
  <div class="row"><label style="margin:0">Seed <input id="seed" type="number" value="1337"></label><button id="gen">New island</button></div>
  <label><input type="checkbox" id="tRocks" checked> show rocks</label>

  <label><input type="checkbox" id="tTrees" checked> show trees</label>

  <label><input type="checkbox" id="tDbg"> colour by region (debug)</label>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

THREE.ColorManagement.enabled = false;   // paint with raw sRGB numbers, cel shader writes them directly

window.addEventListener('error', e => { document.getElementById('err').textContent += (e.message || e) + '\n'; });
window.addEventListener('unhandledrejection', e => { document.getElementById('err').textContent += String(e.reason) + '\n'; });

/* =====================================================================
   0. UTILITIES: RNG, noise, colour helpers
   ===================================================================== */
const SQ3 = Math.sqrt(3);
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hash3i(x,y,z,s){ let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(z|0,1274126177)^Math.imul(s|0,2246822519); h=Math.imul(h^(h>>>13),1274126177); h^=h>>>16; return (h>>>0)/4294967296; }
const fade = t => t*t*(3-2*t);
const lerp = (a,b,t) => a+(b-a)*t;
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
function makeNoise(seed){
  const s = seed|0;
  const n3 = (x,y,z)=>{
    const xi=Math.floor(x), yi=Math.floor(y), zi=Math.floor(z);
    const xf=fade(x-xi), yf=fade(y-yi), zf=fade(z-zi);
    const h=(a,b,c)=>hash3i(xi+a,yi+b,zi+c,s);
    return lerp(lerp(lerp(h(0,0,0),h(1,0,0),xf),lerp(h(0,1,0),h(1,1,0),xf),yf),
                lerp(lerp(h(0,0,1),h(1,0,1),xf),lerp(h(0,1,1),h(1,1,1),xf),yf),zf)*2-1;
  };
  return { n3, n2:(x,y)=>n3(x,y,0.5) };
}
const hex = h => [((h>>16)&255)/255, ((h>>8)&255)/255, (h&255)/255];
const mix3 = (a,b,t) => [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const mul3 = (a,m) => [a[0]*m,a[1]*m,a[2]*m];
function hsl2rgb(h,s,l){ const f=n=>{const k=(n+h*12)%12; return l-s*Math.min(l,1-l)*Math.max(-1,Math.min(k-3,9-k,1));}; return [f(0),f(8),f(4)]; }

/* =====================================================================
   1. CONSTANTS
   ===================================================================== */
const STEP = 1.7;          // world height per terrace level
const INR  = SQ3/2;        // hex inradius (circumradius = 1)
const INNER = 0.86;        // inner ring factor (top plateau vs. outer bevel)
const LIP = 0.13;          // top-edge rounding at cliff lips
const SEA = -0.28;         // sea level
const NR = 34;             // grid radius in micro hexes
const NBQ=[1,0,-1,-1,0,1], NBR=[0,1,1,0,-1,-1];   // axial neighbour k has world direction angle 60*k deg
const DIRX=[],DIRZ=[],CX=[],CZ=[];                // edge k normal / corner j offset (corner j at 60j-30 deg)
for(let k=0;k<6;k++){ const a=k*Math.PI/3; DIRX.push(Math.cos(a)); DIRZ.push(Math.sin(a)); CX.push(Math.cos(a-Math.PI/6)); CZ.push(Math.sin(a-Math.PI/6)); }
// edge k spans corners k and k+1; corner j touches cells c, nb[j-1], nb[j]; shared edge: a.corner k <-> b.corner (k+4)%6, a.corner k+1 <-> b.corner (k+3)%6

const PAL = {
  meadow:[0x588d44,0x679b4a,0x76ab50], boulder:[0x8f8d89,0xa09d97,0xb2aea6], boulderDark:0x6a6762,
  pine:[0x3d7746,0x4b8750,0x5c9a5c], oak:[0x4c8a3e,0x6aa84c,0x80bb58], trunk:0x7a5538,
  sand:0xd9c08a, dirt:0xc9aa7c, snow:[0xe9f1fa,0xd8e6f4], lakeFloor:0xb8a67a
};

/* smooth (position-welded) normals for non-indexed triangle soup — used for terrain tops and for outline hulls */
function smoothNormals(pos){
  const nv=pos.length/3, acc=new Float64Array(nv*3), slot=new Map(), idx=new Int32Array(nv);
  for(let i=0;i<nv;i++){
    const kx=Math.round(pos[i*3]*100)+6000, ky=Math.round(pos[i*3+1]*100)+1000, kz=Math.round(pos[i*3+2]*100)+6000;
    const k=(kx*12001+kz)*2001+ky; let s=slot.get(k); if(s===undefined){ s=slot.size; slot.set(k,s); } idx[i]=s;
  }
  const sum=new Float64Array(slot.size*3);
  for(let t=0;t<nv;t+=3){
    const ax=pos[t*3],ay=pos[t*3+1],az=pos[t*3+2], bx=pos[t*3+3],by=pos[t*3+4],bz=pos[t*3+5], cx_=pos[t*3+6],cy=pos[t*3+7],cz_=pos[t*3+8];
    const ux=bx-ax,uy=by-ay,uz=bz-az, vx=cx_-ax,vy=cy-ay,vz=cz_-az;
    const nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
    for(let q=0;q<3;q++){ const s=idx[t+q]*3; sum[s]+=nx; sum[s+1]+=ny; sum[s+2]+=nz; }
  }
  const out=new Float32Array(nv*3);
  for(let i=0;i<nv;i++){ const s=idx[i]*3; let x=sum[s],y=sum[s+1],z=sum[s+2]; const l=Math.hypot(x,y,z)||1; out[i*3]=x/l; out[i*3+1]=y/l; out[i*3+2]=z/l; }
  return out;
}

/* =====================================================================
   2. WORLD DATA  (the single source of truth: cell.level + queries)
   ===================================================================== */
function buildWorld(seed){
  const rng = mulberry32((seed*2654435761)>>>0 ^ 0x9e3779b9);
  const rnd = () => rng();
  const noise = makeNoise(seed);

  /* ---- micro hex grid (axial, pointy-top, circumradius 1) ---- */
  const W2=2*NR+1, tbl=new Int32Array(W2*W2).fill(-1), cq=[], cr=[];
  for(let q=-NR;q<=NR;q++) for(let r=-NR;r<=NR;r++){ if(Math.abs(q+r)>NR) continue; tbl[(q+NR)*W2+(r+NR)]=cq.length; cq.push(q); cr.push(r); }
  const N=cq.length;
  const idxOf=(q,r)=>(q<-NR||q>NR||r<-NR||r>NR)?-1:tbl[(q+NR)*W2+(r+NR)];
  const cx=new Float32Array(N), cz=new Float32Array(N), nb=new Int32Array(N*6);
  for(let i=0;i<N;i++){ cx[i]=SQ3*(cq[i]+cr[i]/2); cz[i]=1.5*cr[i]; for(let k=0;k<6;k++) nb[i*6+k]=idxOf(cq[i]+NBQ[k],cr[i]+NBR[k]); }
  const cellAt=(x,z)=>{
    const fq=SQ3/3*x - z/3, fr=2/3*z, fy=-fq-fr;
    let rq=Math.round(fq), rr=Math.round(fr), ry=Math.round(fy);
    const dq=Math.abs(rq-fq), dr=Math.abs(rr-fr), dy=Math.abs(ry-fy);
    if(dq>dr&&dq>dy) rq=-rr-ry; else if(dr>dy) rr=-rq-ry;
    return idxOf(rq,rr);
  };

  /* ---- macro regions: jittered macro-hex lattice seeds, micro hexes join the nearest seed (Voronoi on a hex grid) ---- */
  const S=6.2*SQ3, seeds=[];
  for(let j=-12;j<=12;j++) for(let i=-12;i<=12;i++){
    let px=(i+((j&1)?0.5:0))*S, pz=j*S*0.866;
    if(Math.hypot(px,pz)>78) continue;
    seeds.push([px+(rnd()-0.5)*0.66*S, pz+(rnd()-0.5)*0.66*S]);
  }
  const regionRaw=new Int32Array(N);
  for(let c=0;c<N;c++){
    const wx=cx[c]+noise.n2(cx[c]*0.12,cz[c]*0.12)*1.7, wz=cz[c]+noise.n2(cx[c]*0.12+50,cz[c]*0.12)*1.7;   // domain warp -> organic borders
    let best=1e9,bi=0;
    for(let s=0;s<seeds.length;s++){ const d=(wx-seeds[s][0])**2+(wz-seeds[s][1])**2; if(d<best){best=d;bi=s;} }
    regionRaw[c]=bi;
  }
  const remap=new Map(); let NRg=0; const region=new Int16Array(N);
  for(let c=0;c<N;c++){ const id=regionRaw[c]; if(!remap.has(id)) remap.set(id,NRg++); region[c]=remap.get(id); }
  const rcx=new Float64Array(NRg), rcz=new Float64Array(NRg), rcnt=new Int32Array(NRg), touchEdge=new Uint8Array(NRg);
  for(let c=0;c<N;c++){ const r=region[c]; rcx[r]+=cx[c]; rcz[r]+=cz[c]; rcnt[r]++; for(let k=0;k<6;k++) if(nb[c*6+k]<0) touchEdge[r]=1; }
  for(let r=0;r<NRg;r++){ rcx[r]/=rcnt[r]; rcz[r]/=rcnt[r]; }
  const rawAdj=[...Array(NRg)].map(()=>new Set());
  for(let c=0;c<N;c++) for(let k=0;k<6;k++){ const b=nb[c*6+k]; if(b>=0&&region[b]!==region[c]) rawAdj[region[c]].add(region[b]); }

  /* ---- island mask: radial falloff + noise at region centres, largest component, fill enclosed sea ---- */
  const centreRegion=region[idxOf(0,0)];
  function computeLand(IR){
    const land=new Uint8Array(NRg);
    for(let r=0;r<NRg;r++){ const v=Math.hypot(rcx[r],rcz[r])/IR + noise.n2(rcx[r]*0.045+9,rcz[r]*0.045)*0.30; land[r]=(v<1 && !touchEdge[r])?1:0; }
    land[centreRegion]=1;
    // largest connected component
    const comp=new Int32Array(NRg).fill(-1); let best=-1,bestN=0,nc=0;
    for(let r=0;r<NRg;r++){ if(!land[r]||comp[r]>=0) continue; let n=0; const st=[r]; comp[r]=nc; while(st.length){ const a=st.pop(); n++; for(const b of rawAdj[a]) if(land[b]&&comp[b]<0){comp[b]=nc;st.push(b);} } if(n>bestN){bestN=n;best=nc;} nc++; }
    for(let r=0;r<NRg;r++) if(land[r]&&comp[r]!==best) land[r]=0;
    // flood outer sea; whatever sea is not reached is an enclosed hole -> land
    const outer=new Uint8Array(NRg), st=[];
    for(let r=0;r<NRg;r++) if(!land[r]&&touchEdge[r]){outer[r]=1;st.push(r);}
    while(st.length){ const a=st.pop(); for(const b of rawAdj[a]) if(!land[b]&&!outer[b]){outer[b]=1;st.push(b);} }
    for(let r=0;r<NRg;r++) if(!land[r]&&!outer[r]) land[r]=1;
    return land;
  }
  let IR=26*SQ3, landR=computeLand(IR);
  for(let it=0;it<8;it++){ let n=0; for(let r=0;r<NRg;r++) n+=landR[r]; if(n>=14) break; IR*=1.1; landR=computeLand(IR); }

  const isLand=new Uint8Array(N);
  for(let c=0;c<N;c++) isLand[c]=landR[region[c]];
  // micro-level coastline wobble (accrete beach cells / erode peninsula tips). Snapshot so it does not chain.
  { const snap=isLand.slice();
    for(let c=0;c<N;c++){
      let ln=0,on=0,lr=-1; for(let k=0;k<6;k++){ const b=nb[c*6+k]; if(b<0||!snap[b]) on++; else {ln++; lr=region[b];} }
      if(!snap[c]){ if(ln>=2 && nb.slice(c*6,c*6+6).every(b=>b>=0) && hash3i(cq[c],cr[c],3,seed)<0.45){ isLand[c]=1; region[c]=lr; } }
      else if(on>=4 && landR[region[c]] && hash3i(cq[c],cr[c],4,seed)<0.6) isLand[c]=0;
    }
  }
  for(let c=0;c<N;c++) if(!isLand[c]) region[c]=-1;
  // regions that survive
  const rCells=[...Array(NRg)].map(()=>[]);
  for(let c=0;c<N;c++) if(isLand[c]) rCells[region[c]].push(c);
  for(let r=0;r<NRg;r++) landR[r]=rCells[r].length>0?1:0;
  const radj=[...Array(NRg)].map(()=>new Set()), isCoastR=new Uint8Array(NRg);
  for(let c=0;c<N;c++) if(isLand[c]) for(let k=0;k<6;k++){
    const b=nb[c*6+k];
    if(b<0||!isLand[b]) isCoastR[region[c]]=1; else if(region[b]!==region[c]) radj[region[c]].add(region[b]);
  }
  // recompute centroids + a centre cell per region
  const rCenterCell=new Int32Array(NRg).fill(-1);
  for(let r=0;r<NRg;r++){ if(!landR[r]) continue; let sx=0,sz=0; for(const c of rCells[r]){sx+=cx[c];sz+=cz[c];} rcx[r]=sx/rCells[r].length; rcz[r]=sz/rCells[r].length;
    let bd=1e9; for(const c of rCells[r]){ const d=(cx[c]-rcx[r])**2+(cz[c]-rcz[r])**2; if(d<bd){bd=d;rCenterCell[r]=c;} } }
  const landList=[]; for(let r=0;r<NRg;r++) if(landR[r]) landList.push(r);

  /* ---- distances: dl = hex distance to land (sea cells), dOcean for land ---- */
  const dl=new Int16Array(N).fill(999);
  { const q=[]; for(let c=0;c<N;c++) if(isLand[c]){dl[c]=0;q.push(c);} for(let h=0;h<q.length;h++){ const c=q[h]; for(let k=0;k<6;k++){ const b=nb[c*6+k]; if(b>=0&&dl[b]>dl[c]+1){dl[b]=dl[c]+1;q.push(b);} } } }

  /* ---- region depth + terrace LEVEL (0 beach, 1..4 inland) ---- */
  const depth=new Int16Array(NRg).fill(-1);
  { const q=[]; for(const r of landList) if(isCoastR[r]){depth[r]=0;q.push(r);} for(let h=0;h<q.length;h++){ const a=q[h]; for(const b of radj[a]) if(depth[b]<0){depth[b]=depth[a]+1;q.push(b);} } }
  let maxDepth=0, peak=-1;
  for(const r of landList){ if(depth[r]>maxDepth) maxDepth=depth[r]; }
  { let bs=-1e9; for(const r of landList){ const sc=depth[r]*1000-Math.hypot(rcx[r],rcz[r]); if(sc>bs){bs=sc;peak=r;} } }
  const rLevel=new Int8Array(NRg);
  for(const r of landList) rLevel[r]=depth[r]===0?0:Math.min(4,depth[r]);
  if(depth[peak]>0 && rLevel[peak]<4) rLevel[peak]++;
  for(const r of landList) if(depth[r]>=2 && r!==peak && rLevel[r]<4 && noise.n2(rcx[r]*0.1+3,rcz[r]*0.1)>0.1) rLevel[r]++;

  function connected(ex){            // walkable graph: regions linked when |level diff| <= 1 (0 = flat, 1 = ramp)
    const nodes=landList.filter(r=>!ex.has(r)); if(!nodes.length) return {ok:true,comp:new Map()};
    const comp=new Map(); let nc=0;
    for(const r of nodes){ if(comp.has(r)) continue; const st=[r]; comp.set(r,nc); while(st.length){ const a=st.pop(); for(const b of radj[a]) if(!ex.has(b)&&!comp.has(b)&&Math.abs(rLevel[a]-rLevel[b])<=1){comp.set(b,nc);st.push(b);} } nc++; }
    return {ok:nc===1,comp};
  }
  function repairLevels(ex){          // lower the higher side of a bridging cliff-only border until the graph connects
    for(let it=0;it<400;it++){
      const {ok,comp}=connected(ex); if(ok) return true;
      const cand=[]; for(const a of landList){ if(ex.has(a)) continue; for(const b of radj[a]) if(!ex.has(b)&&comp.get(a)!==comp.get(b)&&rLevel[a]>rLevel[b]) cand.push([a,b]); }
      if(!cand.length) return false;
      const [a,b]=cand[Math.floor(rnd()*cand.length)]; rLevel[a]=rLevel[b]+1;
    }
    return false;
  }
  repairLevels(new Set());

  /* ---- lakes: local-minimum interior regions become basins ---- */
  const lakes=new Set();
  const isLocalMin=r=>{ for(const n of radj[r]) if(!landR[n]||rLevel[n]<rLevel[r]) return false; return true; };
  const nearLake=r=>{ for(const n of radj[r]) if(lakes.has(n)) return true; return false; };
  const lakeCands=()=>landList.filter(r=>depth[r]>=2&&rLevel[r]>=2&&r!==peak&&!isCoastR[r]&&![...radj[r]].some(n=>isCoastR[n]&&false));
  { const cands=lakeCands(); for(let i=cands.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[cands[i],cands[j]]=[cands[j],cands[i]];}
    for(const r of cands){ if(lakes.size>=2) break; if(isLocalMin(r)&&!nearLake(r)){ const ex=new Set([...lakes,r]); if(connected(ex).ok) lakes.add(r); } }
    if(lakes.size===0){      // force one: raise the lower neighbours up to the candidate's level (still a valid terrace stack)
      const order=cands.slice().sort((a,b)=>[...radj[a]].filter(n=>rLevel[n]<rLevel[a]).length-[...radj[b]].filter(n=>rLevel[n]<rLevel[b]).length);
      for(const r of order){
        const save=rLevel.slice(); for(const n of radj[r]) if(rLevel[n]<rLevel[r]) rLevel[n]=rLevel[r];
        const ex=new Set([r]);
        if(repairLevels(ex)&&isLocalMin(r)&&rLevel[r]>=2){ lakes.add(r); break; }
        rLevel.set(save);
      }
    }
  }
  let maxL=0; for(const r of landList) if(rLevel[r]>maxL) maxL=rLevel[r];

  /* ---- biome per region ---- */
  // 0 sea,1 beach,2 meadow,3 forest,4 rocky highland,5 snow,6 lake
  const rBiome=new Uint8Array(NRg);
  for(const r of landList){
    const l=rLevel[r];
    if(lakes.has(r)) rBiome[r]=6;
    else if(l===0) rBiome[r]=noise.n2(rcx[r]*0.07+40,rcz[r]*0.07)>0.35?3:2;
    else if(maxL>=3&&l===maxL) rBiome[r]=5;
    else if(l>=3) rBiome[r]=4;
    else rBiome[r]=noise.n2(rcx[r]*0.07+20,rcz[r]*0.07)>-0.05?3:2;
  }
  { let m=0,f=0; for(const r of landList){ if(rBiome[r]===2)m++; if(rBiome[r]===3)f++; }
    for(const r of landList) if(rBiome[r]===3&&m===0&&f>1){rBiome[r]=2;m++;f--;} else if(rBiome[r]===2&&f===0&&m>1){rBiome[r]=3;f++;m--;} }

  /* ---- connectivity: spanning tree over level-diff==1 borders -> ramps ---- */
  const rampDir=new Int8Array(N).fill(-1), pathF=new Uint8Array(N), noVar=new Uint8Array(N);
  const shared=new Map();
  for(let c=0;c<N;c++){ if(!isLand[c]) continue; for(let k=0;k<6;k++){ const b=nb[c*6+k]; if(b<0||!isLand[b]||region[b]===region[c]) continue;
    const ra=region[c], rb=region[b]; if(lakes.has(ra)||lakes.has(rb)) continue;
    if(rLevel[ra]-rLevel[rb]===1){ const key=ra*NRg+rb; if(!shared.has(key)) shared.set(key,[]); shared.get(key).push([c,k,b]); } } }
  const uf=new Int32Array(NRg).map((_,i)=>i); const find=a=>{while(uf[a]!==a){uf[a]=uf[uf[a]];a=uf[a];}return a;};
  for(const a of landList) for(const b of radj[a]) if(a<b&&!lakes.has(a)&&!lakes.has(b)&&rLevel[a]===rLevel[b]) uf[find(a)]=find(b);
  const keys=[...shared.keys()]; for(let i=keys.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[keys[i],keys[j]]=[keys[j],keys[i]];}
  const chosen=[], rest=[];
  for(const key of keys){ const hi=Math.floor(key/NRg), lo=key%NRg; if(find(hi)!==find(lo)){uf[find(hi)]=find(lo);chosen.push(key);} else rest.push(key); }
  for(let i=0;i<Math.min(rest.length,1+Math.floor(rnd()*2));i++) chosen.push(rest[i]);   // 1-2 extra loops
  function walkPath(start,reg,maxLen){
    let cur=start; const tc=rCenterCell[reg];
    for(let i=0;i<maxLen;i++){ pathF[cur]=1; noVar[cur]=1; if(cur===tc) break;
      let best=-1,bd=(cx[cur]-cx[tc])**2+(cz[cur]-cz[tc])**2;

function makeRockVariant(i){

        float b1=smoothstep(T0-W,T0+W,nl), b2=smoothstep(T1-W,T1+W,nl);
        float lv=mix(mix(0.60,0.80,b1),1.0,b2);
        vec3 tint=mix(mix(vec3(0.88,0.93,1.06),vec3(1.0),b1),vec3(1.03,1.0,0.92),b2);
        vec3 fill=mix(uGround,uSky,n.y*0.5+0.5);
        vec3 col=vCol*lv*tint*fill;
        col*=1.0-0.4*(1.0-smoothstep(-0.9,-0.1,n.y));          // undersides darken up to 40%
        col=mix(col,uFogCol,smoothstep(uFog.x,uFog.y,vDist));
        gl_FragColor=vec4(col,1.0);
      }`
  });
}
function outlineMaterial(hexCol,thick){
  const c=hex(hexCol);
  return new THREE.ShaderMaterial({
    side:THREE.BackSide, uniforms:{...SHARED,uCol:{value:new THREE.Vector3(...c)},uThick:{value:thick}},
    vertexShader:`
      ${INSTANCE_GLSL}
      attribute vec3 aSmooth; uniform float uThick; varying float vDist;
      void main(){
        vec4 wp; vec3 wn;
        #ifdef USE_INSTANCING
          wp=modelMatrix*(instanceMatrix*vec4(position,1.0)); wn=mat3(modelMatrix)*instNormal(aSmooth,instanceMatrix);
        #else
          wp=modelMatrix*vec4(position,1.0); wn=mat3(modelMatrix)*aSmooth;
        #endif
        float dist=length((viewMatrix*wp).xyz);
        wp.xyz+=normalize(wn)*uThick*clamp(dist/130.0,0.6,2.4);       // inverted hull, thickness grows a little with distance
        vec4 mv=viewMatrix*wp; vDist=length(mv.xyz);
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`
      uniform vec3 uCol,uFogCol; uniform vec2 uFog; varying float vDist;
      void main(){ gl_FragColor=vec4(mix(uCol,uFogCol,smoothstep(uFog.x,uFog.y,vDist)),1.0); }`
  });
}
function waterMaterial(tex,F){
  return new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, uniforms:{...SHARED,uDepth:{value:tex},uOrigin:{value:new THREE.Vector2(F.x0,F.z0)},uStep:{value:F.h},uDims:{value:new THREE.Vector2(F.GW,F.GH)}},
    vertexShader:`varying vec3 vW; varying float vDist; void main(){ vec4 wp=modelMatrix*vec4(position,1.0); vW=wp.xyz; vec4 mv=viewMatrix*wp; vDist=length(mv.xyz); gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`
      uniform sampler2D uDepth; uniform vec2 uOrigin,uDims; uniform float uStep; uniform vec3 uFogCol; uniform vec2 uFog;
      varying vec3 vW; varying float vDist;
      float h2(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
      float vn(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f); return mix(mix(h2(i),h2(i+vec2(1,0)),f.x),mix(h2(i+vec2(0,1)),h2(i+vec2(1,1)),f.x),f.y); }
      void main(){
        vec2 uv=((vW.xz-uOrigin)/uStep+0.5)/uDims;
        float d=(uv.x<0.0||uv.x>1.0||uv.y<0.0||uv.y>1.0)?3.0:texture2D(uDepth,uv).r*4.0-1.0;     // depth below this water surface
        float dd=d+(vn(vW.xz*0.6)-0.5)*0.3;
        float t=smoothstep(0.0,1.7,dd); t=mix(t,floor(t*3.0+0.5)/3.0,0.55);                    // banded two-tone
        vec3 col=mix(vec3(0.31,0.82,0.78),vec3(0.10,0.43,0.67),t);
        float patt=vn(vW.xz*0.9+7.0)*0.5+vn(vW.xz*2.3)*0.5; col+=0.05*step(0.74,patt);
        float foam=1.0-smoothstep(0.14,0.20,dd+(vn(vW.xz*3.0)-0.5)*0.12);
        float ring=smoothstep(0.40,0.43,dd)*(1.0-smoothstep(0.47,0.50,dd))*0.55;
        col=mix(col,vec3(0.94,0.99,0.98),max(foam,ring));
        float a=mix(0.55,1.0,smoothstep(0.0,1.7,dd)); a=max(a,max(foam,ring));
        col=mix(col,uFogCol,smoothstep(uFog.x,uFog.y,vDist));
        gl_FragColor=vec4(col,a);
      }`
  });
}

/* =====================================================================
   7. SCENE ASSEMBLY
   ===================================================================== */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0xbfe0e4);
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,5,1600);
camera.position.set(115,125,150);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minPolarAngle=0.35; controls.maxPolarAngle=1.18; controls.minDistance=10; controls.maxDistance=330;
controls.target.set(0,2,0);
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

const matTerrain=celMaterial(true), matProp=celMaterial(false);
const matCliffOutline=outlineMaterial(0x1f2b2b,0.13), matRockOutline=outlineMaterial(0x1f2b2b,0.11), matTreeOutline=outlineMaterial(0x141708,0.10);
const ui={rocks:true,raw:false,trees:true,grid:false,dbg:false,ramp:false};
let rampIdx=-1, tween=null;
let current=null, rockVariants=null, treeVariants=null, tuftGeo=null, reedGeo=null;

function instanced(geo,mat,list,fill,outlineMat){
  if(!list.length) return null;
  const m=new THREE.InstancedMesh(geo,mat,list.length); m.frustumCulled=false;
  const col=new THREE.Color();
  list.forEach((it,i)=>{ fill(it,_m4); m.setMatrixAt(i,_m4); if(it.tint!==undefined){ const t=it.tint; col.setRGB(t,t*(0.98+0.04*((i*7)%3)/2),t); m.setColorAt(i,col); } });
  m.instanceMatrix.needsUpdate=true;
  const g=new THREE.Group(); g.add(m);
  if(outlineMat){ const o=new THREE.InstancedMesh(geo,outlineMat,list.length); o.instanceMatrix=m.instanceMatrix; o.frustumCulled=false; g.add(o); }
  return g;
}

function generate(seed){
  const t0=performance.now();
  if(current){ current.group.traverse(o=>{ if(o.geometry&&!o.userData.shared) o.geometry.dispose(); }); scene.remove(current.group); if(current.depthTex) current.depthTex.dispose(); }
  if(!rockVariants){
    rockVariants=[...Array(8)].map((_,i)=>makeRockVariant(i));
    treeVariants=[makePine(0,false),makePine(1,false),makePine(2,false),makeOak(0),makeOak(1),makeOak(2),null,null,makePine(1,true),makePine(2,true)];
    tuftGeo=makeTuft(0.28,hex(PAL.meadow[1]),hex(0x8cc060)); reedGeo=makeTuft(0.7,hex(0x6f8f46),hex(0xa8b866));
  }
  const W=buildWorld(seed);
  const F=buildField(W);
  const tF=performance.now();
  const topGeo=buildTerrain(W);
  const group=new THREE.Group(); const rocksGroup=new THREE.Group(), treesGroup=new THREE.Group();
  group.add(rocksGroup,treesGroup);
  const top=new THREE.Mesh(topGeo,matTerrain); top.frustumCulled=false; group.add(top);
  const grid=buildGridLines(W); grid.visible=ui.grid; group.add(grid);

  const rocks=W.rocks=placeRocks(W,rockVariants.length);
  const rockCount=rocks.length;
  rockVariants.forEach((geo,vi)=>{
    const list=rocks.filter(r=>r.v===vi);
    const g=instanced(geo,matProp,list,(r,m)=>m.compose(_v.set(r.x,r.y,r.z),_q.set(r.qx,r.qy,r.qz,r.qw),_s.set(r.sx,r.sy,r.sz)),matRockOutline);
    if(g) rocksGroup.add(g);
  });
  const trees=placeTrees(W);
  treeVariants.forEach((geo,vi)=>{ if(!geo) return;
    const list=trees.filter(t=>t.type===vi);
    const g=instanced(geo,matProp,list,(t,m)=>m.compose(_v.set(t.x,t.y,t.z),_q.setFromAxisAngle(AY,t.rot),_s.set(t.sc,t.sc*(0.95+0.15*((t.rot*13)%1)),t.sc)),matTreeOutline);
    if(g) treesGroup.add(g);
  });
  const props=placeProps(W);
  const gT=instanced(tuftGeo,matProp,props.tufts.map(p=>({...p,tint:0.9+0.2*((p.rot*7)%1)})),(p,m)=>m.compose(_v.set(p.x,p.y,p.z),_q.setFromAxisAngle(AY,p.rot),_s.set(p.sc,p.sc,p.sc)),null); if(gT) group.add(gT);
  const gR=instanced(reedGeo,matProp,props.reeds.map(p=>({...p,tint:1})),(p,m)=>m.compose(_v.set(p.x,p.y,p.z),_q.setFromAxisAngle(AY,p.rot),_s.set(p.sc,p.sc,p.sc)),null); if(gR) group.add(gR);
  const gS=instanced(rockVariants[0],matProp,props.stones.map(p=>({...p,tint:1})),(p,m)=>m.compose(_v.set(p.x,p.y+p.sc*0.05,p.z),_q.setFromAxisAngle(AY,p.rot),_s.set(p.sc*1.6,p.sc*0.7,p.sc*1.3)),null); if(gS) group.add(gS);

  // water: per-texel depth below the local water surface (sea or lake), straight from the heightfield
  const data=new Uint8Array(F.n);
  for(let k=0;k<F.n;k++) data[k]=Math.round(clamp((F.wl[k]-F.H[k]+1)/4,0,1)*255);
  const depthTex=new THREE.DataTexture(data,F.GW,F.GH,THREE.RedFormat,THREE.UnsignedByteType);
  depthTex.unpackAlignment=1; depthTex.minFilter=depthTex.magFilter=THREE.LinearFilter; depthTex.wrapS=depthTex.wrapT=THREE.ClampToEdgeWrapping; depthTex.needsUpdate=true;
  const matWater=waterMaterial(depthTex,F);
  const sea=new THREE.Mesh(new THREE.PlaneGeometry(1400,1400),matWater); sea.rotation.x=-Math.PI/2; sea.position.y=SEA; sea.renderOrder=2; group.add(sea);
  { const lp=[]; for(let j=0;j<F.GH-1;j++) for(let i=0;i<F.GW-1;i++){ const k=j*F.GW+i, y=F.wl[k]; if(y===SEA) continue;
      const x=F.x0+i*F.h, z=F.z0+j*F.h, e=F.h; lp.push(x,y,z, x,y,z+e, x+e,y,z, x+e,y,z, x,y,z+e, x+e,y,z+e); }
    if(lp.length){ const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(lp,3)); const lm=new THREE.Mesh(g,matWater); lm.renderOrder=3; lm.frustumCulled=false; group.add(lm); } }

  scene.add(group);
  current={group,rocksGroup,treesGroup,grid,depthTex,W};
  applyToggles();
  const ms=performance.now()-t0;
  // stats
  let land=0; for(let c=0;c<W.N;c++) if(W.isLand[c]) land++;
  const okR=F.ramps.filter(r=>r.ok).length, ms2=Math.max(0,...F.ramps.map(r=>r.maxSlope));
  current.stats={land,regions:W.landList.length,lakes:W.lakes.size,contour:W.contourLen,rocks:rockCount,trees:trees.length,ms,maxL:W.maxLvl,ramps:F.ramps.length,okR,ms2,verts:F.n,merged:W.merged,tf:tF-t0};
  rampIdx=-1;
  window.__poc={W,current,THREE,scene,camera,renderer};
}

function applyToggles(){
  if(!current) return;
  current.rocksGroup.visible=ui.rocks&&!ui.raw; current.treesGroup.visible=ui.trees; current.grid.visible=ui.grid;
  matTerrain.uniforms.uDebug.value=ui.dbg?1:0; matTerrain.uniforms.uRampHi.value=ui.ramp?1:0;
}
const $=id=>document.getElementById(id);
$('tRocks').onchange=e=>{ui.rocks=e.target.checked;applyToggles();};
$('tRaw').onchange=e=>{ui.raw=e.target.checked;applyToggles();};
$('tTrees').onchange=e=>{ui.trees=e.target.checked;applyToggles();};
$('tGrid').onchange=e=>{ui.grid=e.target.checked;applyToggles();};
$('tDbg').onchange=e=>{ui.dbg=e.target.checked;applyToggles();};
$('tRamp').onchange=e=>{ui.ramp=e.target.checked;applyToggles();};
$('nextRamp').onclick=()=>{ if(!current) return; const R=current.W.F.ramps; if(!R.length) return; rampIdx=(rampIdx+1)%R.length; const r=R[rampIdx];
  const t=new THREE.Vector3(r.px,r.y,r.pz), to=t.clone().add(new THREE.Vector3(-r.ax*17+r.az*5,13,-r.az*17-r.ax*5));   // camera on the low side, looking uphill
  tween={t0:performance.now(),dur:1300,fT:controls.target.clone(),fP:camera.position.clone(),tT:t,tP:to}; };
$('gen').onclick=()=>{ $('seed').value=Math.floor(Math.random()*1e6); generate(+$('seed').value); };
$('seed').addEventListener('keydown',e=>{ if(e.key==='Enter') generate(+$('seed').value|0); });
$('seed').addEventListener('change',()=>generate(+$('seed').value|0));

generate(+$('seed').value|0);

let lastStat=0;
function frame(t){
  if(tween){ const u=Math.min(1,(performance.now()-tween.t0)/tween.dur), e=u*u*(3-2*u); controls.target.lerpVectors(tween.fT,tween.tT,e); camera.position.lerpVectors(tween.fP,tween.tP,e); if(u>=1) tween=null; }
  controls.update();
  renderer.render(scene,camera);
  if(t-lastStat>500&&current){ lastStat=t; const s=current.stats;
    $('stats').textContent=
`hexes ${s.land}  regions ${s.regions}  lakes ${s.lakes}  levels 0..${s.maxL}
grid verts ${s.verts}  small hexes merged ${s.merged}
ramps ${s.ramps} (ok ${s.okR}, max slope ${s.ms2.toFixed(2)})
contour len ${s.contour.toFixed(0)}  rocks ${s.rocks}  trees ${s.trees}
tris ${renderer.info.render.triangles.toLocaleString()}
gen ${s.ms.toFixed(0)} ms (field ${s.tf.toFixed(0)})`; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
